[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_domct: requires the do-mpc package (Baseline #1 only)",
    "requires_casadi: requires the casadi package (SOS baseline glue code only)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[project]
name = "physics-informed-safe-deepc"
version = "0.0.1"
description = "Physics-informed, safety-certified direct data-driven predictive control (Track B implementation)"
requires-python = ">=3.10"
