name: physics-informed-safe-deepc
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10.14
  - numpy=1.26.4
  - scipy=1.13.0
  - matplotlib=3.8.4
  - pytest=8.1.1
  - pytest-cov=5.0.0
  - pyyaml=6.0.1
  - pandas=2.2.2
  - pip=24.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.0+cu121
      - cvxpy==1.5.1
      - osqp==0.6.7.post0
      - casadi==3.6.5
      - do-mpc==4.6.4
      - wandb==0.17.0
      - control==0.10.0
      - statsmodels==0.14.2
      - tqdm==4.66.4

# Notes:
# - CasADi is a fallback QP/NLP path per Research Plan §8 if CVXPY+OSQP proves
#   insufficiently flexible for nonlinear-constraint experiments (e.g. SOS baseline glue code).
# - do-mpc is used only for Baseline #1 (model-based MPC, known dynamics).
# - GPU is optional (helps autoencoder training, Sections 2.1 / 4). CPU-only
#   torch wheel is fine for the problem sizes in this project; swap the torch
#   pip line for a CUDA build if you have a GPU available.
# - Recreate with: conda env create -f environment.yml
# - Update with:   conda env update -f environment.yml --prune
