# Example config -- Van der Pol physics-informed Koopman autoencoder training.
# Track B Implementation Plan Sec.2.1. One YAML per experiment configuration
# (Track B repo-structure spec). Fill in / adjust once models/train.py is
# implemented (Week 2-4) -- this is a placeholder showing the expected shape.

benchmark: van_der_pol
seed: 0

data:
  T: 2000              # trajectory length (raw samples)
  dt: 0.05
  mu: 1.0
  excitation: prbs
  noise_sigma: 0.01
  train_val_split: 0.8

model:
  state_dim: 2
  input_dim: 1
  lift_dim: 4
  hidden_dims: [64, 64]
  h_coordinate: 0       # placeholder -- see sims/van_der_pol.py::safe_set TODO
  bilinear: false

training:
  lambda_physics: 1.0   # set to 0.0 to reproduce the no-physics ablation
  lambda_recon: 1.0
  lambda_dynamics: 1.0
  lambda_pred: 1.0
  lr: 1.0e-3
  epochs: 200
  batch_size: 64
  early_stopping_patience: 20

logging:
  backend: wandb        # or "local"
  project: physics-informed-safe-deepc
  run_name: vdp_autoencoder_seed0
